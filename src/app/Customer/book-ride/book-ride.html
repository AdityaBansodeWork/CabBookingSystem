<main>

  <div class="booking-view-container d-flex p-4">

    <div class="booking-float-card shadow-lg">
      <h5 class="fw-bold mb-4">Where to?</h5>

      <div class="location-inputs mb-4">
        <div class="input-group mb-2">
          <span class="input-group-text bg-light border-0"></span>
          <input type="text" class="form-control border-0 bg-light" placeholder="Pickup Location">
        </div>

        <div class="dots-connector ms-3 my-1"></div>

        <div class="input-group">
          <span class="input-group-text bg-light border-0"></span>
          <input type="text" class="form-control border-0 bg-light" placeholder="Drop Destination">
        </div>

      </div>

      <div class="ride-options mb-4">
        <small class="text-muted d-block mb-2">Select Ride Type</small>
        <div class="row g-2">
          <div class="col-4">
            <div class="ride-type-card active text-center p-2">
              <i class="bi bi-car-front fs-3"></i>
              <div class="small">Mini</div>
            </div>
          </div>
          <div class="col-4">
            <div class="ride-type-card text-center p-2">
              <i class="bi bi-taxi-front fs-3"></i>
              <div class="small">Sedan</div>
            </div>
          </div>
          <div class="col-4">
            <div class="ride-type-card text-center p-2">
              <i class="bi bi-truck-front fs-3"></i>
              <div class="small">SUV</div>
            </div>
          </div>
        </div>
      </div>

      <button class="btn btn-primary w-100 py-3 rounded-3 fw-bold">Confirm Booking</button>
    </div>

  </div>


  <div id="" class="map shadow-lg">

    <img src="map.jpg" alt="Map is here">
  </div>

</main>
