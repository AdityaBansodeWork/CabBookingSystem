<div class="trips-container">
  <div class="trips-header">
    <div class="header-text">
      <h2>My Trips</h2>
      <p>You have completed 12 rides this month</p>
    </div>
    <div class="filter-group">
      <button class="filter-btn active">All</button>
      <button class="filter-btn">Completed</button>
      <button class="filter-btn">Cancelled</button>
    </div>
  </div>

  <div class="trips-list">
    @for (trip of trips; track trip.date) {
      <div class="trip-card" [class.cancelled]="trip.status === 'Cancelled'">
        
        <div class="trip-time-info">
          <span class="date">{{trip.date}}</span>
          <span class="time">{{trip.time}}</span>
          <div class="vehicle-tag">{{trip.type}}</div>
        </div>

        <div class="trip-route">
          <div class="location">
            <span class="dot pickup"></span> {{trip.pickup}}
          </div>
          <div class="location">
            <span class="dot drop"></span> {{trip.drop}}
          </div>
        </div>

        <div class="trip-payment">
          <div class="price">₹{{trip.price}}</div>
          <span class="status-label" [class.success]="trip.status === 'Completed'">
            {{ trip.status === 'Completed' ? 'Paid via Wallet' : 'Cancelled' }}
          </span>
        </div>

        <div class="trip-action">
          @if (trip.status === 'Completed') {
            <button class="action-btn" (click)="downloadReceipt(trip)" [disabled]="isDownloading() === trip.date">
              {{ isDownloading() === trip.date ? '...' : 'Receipt' }}
            </button>
          } @else {
            <button class="action-btn secondary">Details</button>
          }
        </div>
        
      </div>
    }
  </div>
</div>
